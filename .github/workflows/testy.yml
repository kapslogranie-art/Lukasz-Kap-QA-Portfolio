name: Testy automatyczne

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "0 6 * * 1"   # co poniedziałek — regresja smoke

jobs:
  api:
    name: Testy API (PyTest + requests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-qa/08-automatyzacja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -m api --html=raport-api.html --self-contained-html
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-api
          path: portfolio-qa/08-automatyzacja/raport-api.html

  ui:
    name: Testy UI (PyTest + Selenium)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: portfolio-qa/08-automatyzacja
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -m ui --html=raport-ui.html --self-contained-html
        env:
          HEADLESS: "1"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: raport-ui
          path: portfolio-qa/08-automatyzacja/raport-ui.html

  postman:
    name: Kolekcja Postman (Newman)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npx --yes newman run portfolio-qa/05-testy-api/restful-booker.postman_collection.json
